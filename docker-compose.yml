services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - urlshortner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - urlshortner
    command:
      - "-path=/migrations"
      - "-database=${DATABASE_URL}"
      - "up"

  coreservice:
    build:
      context: .
      dockerfile: deployments/docker/coreservice.Dockerfile
      target: runtime
    environment:
      HTTP_ADDR: ${HTTP_ADDR}
      DATABASE_URL: ${DATABASE_URL}
      BASE_URL: ${BASE_URL}
      DEBUG: ${DEBUG}
    ports:
      - "8080:8080"
    networks:
      - urlshortner
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:

networks:
  urlshortner:
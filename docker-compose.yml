services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - urlshortner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - urlshortner
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      # RabbitMQ restricts the built-in "guest" user to loopback connections
      # only, which containers-to-container traffic never is - so a
      # dedicated user is required for gateway/statservice to connect at all.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    networks:
      - urlshortner
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - urlshortner
    command:
      - "-path=/migrations"
      - "-database=${DATABASE_URL}"
      - "up"

  coreservice:
    build:
      context: .
      dockerfile: deployments/docker/coreservice.Dockerfile
      target: runtime
    environment:
      GRPC_ADDR: ${GRPC_ADDR}
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: ${DEBUG}
      REDIS_ADDR: redis:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
    ports:
      - "9090:9090" # published for local debugging (e.g. grpcurl); not needed by gateway, which reaches coreservice via the internal network
    networks:
      - urlshortner
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc-health-probe", "-addr=:9090"]
      interval: 5s
      timeout: 5s
      retries: 10

  statservice:
    build:
      context: .
      dockerfile: deployments/docker/statservice.Dockerfile
      target: runtime
    environment:
      GRPC_ADDR: ":9091"
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: ${DEBUG}
      RABBITMQ_URL: ${RABBITMQ_URL}
      CLICK_QUEUE: ${CLICK_QUEUE}
      WORKER_COUNT: ${WORKER_COUNT}
      BATCH_SIZE: ${BATCH_SIZE}
      FLUSH_INTERVAL_MS: ${FLUSH_INTERVAL_MS}
    ports:
      - "9091:9091" # published for local debugging (e.g. grpcurl); not needed by gateway, which reaches statservice via the internal network
    networks:
      - urlshortner
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc-health-probe", "-addr=:9091"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: deployments/docker/gateway.Dockerfile
      target: runtime
    environment:
      HTTP_ADDR: ${HTTP_ADDR}
      CORE_GRPC_ADDR: coreservice:9090
      STAT_GRPC_ADDR: statservice:9091
      BASE_URL: ${BASE_URL}
      DEBUG: ${DEBUG}
      RABBITMQ_URL: ${RABBITMQ_URL}
      CLICK_QUEUE: ${CLICK_QUEUE}
    ports:
      - "8080:8080"
    networks:
      - urlshortner
    depends_on:
      coreservice:
        condition: service_healthy
      statservice:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

networks:
  urlshortner:
